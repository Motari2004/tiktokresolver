<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok No-Watermark Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f10;
      color: #f2f2f2;
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.sub { color: #888; margin-top: 0; margin-bottom: 32px; font-size: 14px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1c;
      color: #f2f2f2;
    }
    input:focus { outline: none; border-color: #4a90e2; }
    button {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result {
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-all;
    }
    #result a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 18px;
      background: #1f8b4c;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    #result a:hover { background: #23a058; }
    .error { color: #ff6b6b; }
    .spinner { color: #888; }
  </style>
</head>
<body>
  <h1>TikTok No-Watermark Downloader</h1>
  <p class="sub">Paste a TikTok link and get the direct MP4 URL.</p>

  <div class="row">
    <input id="url" placeholder="https://www.tiktok.com/@user/video/..." />
    <button id="btn" onclick="resolve()">Resolve</button>
  </div>

  <div id="result"></div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('url');
    const result = document.getElementById('result');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') resolve(); });

    async function resolve() {
      const url = input.value.trim();
      if (!url) return;

      btn.disabled = true;
      result.className = 'spinner';
      result.textContent = 'Resolving...';

      try {
        const res = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (res.ok && data.status === 'ok') {
          result.className = '';
          result.innerHTML =
            `<div>✅ Direct link captured:</div>
             <a href="${data.download_url}" target="_blank" rel="noopener">Download video</a>`;
        } else {
          result.className = 'error';
          result.textContent = '❌ ' + (data.detail || 'Failed to resolve');
        }
      } catch (err) {
        result.className = 'error';
        result.textContent = '❌ Network error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
