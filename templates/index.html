<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok Resolver — Download + Caption</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f10;
      color: #f2f2f2;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 { font-size: 24px; margin-bottom: 8px; }

    p.sub {
      color: #888;
      margin-top: 0;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1c;
      color: #f2f2f2;
    }

    input:focus {
      outline: none;
      border-color: #4a90e2;
    }

    button {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: #3a7bc8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #result {
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.5;
    }

    #result a.download {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 18px;
      background: #1f8b4c;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    #result a.download:hover { background: #23a058; }

    .error { color: #ff6b6b; }
    .spinner { color: #888; }

    /* --- Caption block --- */
    .caption-label {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .caption-box {
      margin-top: 6px;
      padding: 14px;
      background: #1a1a1c;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #e8e8e8;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow-y: auto;
    }

    .caption-box::-webkit-scrollbar { width: 8px; }
    .caption-box::-webkit-scrollbar-track { background: #1a1a1c; }
    .caption-box::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .caption-empty {
      color: #666;
      font-style: italic;
    }

    /* --- URL block --- */
    .url-label {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copy-btn {
      padding: 3px 10px;
      font-size: 12px;
      background: #333;
      color: #eee;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 500;
    }

    .copy-btn:hover { background: #444; }

    .url-box {
      margin-top: 6px;
      padding: 12px;
      background: #1a1a1c;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 12px;
      font-family: ui-monospace, "Cascadia Code", Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      color: #c7c7c7;
      max-height: 220px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .url-box::-webkit-scrollbar { width: 8px; }
    .url-box::-webkit-scrollbar-track { background: #1a1a1c; }
    .url-box::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .meta {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>TikTok Resolver</h1>
  <p class="sub">Paste a TikTok link and get the direct MP4 URL + spoken caption.</p>

  <div class="row">
    <input id="url" placeholder="https://www.tiktok.com/@user/video/..." />
    <button id="btn" onclick="resolve()">Resolve</button>
  </div>

  <div id="result"></div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('url');
    const result = document.getElementById('result');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') resolve();
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function resolve() {
      const url = input.value.trim();
      if (!url) return;

      btn.disabled = true;
      result.className = 'spinner';
      result.textContent = 'Resolving… (download + caption, ~10–20s)';

      let downloadData = null;
      let transcriptData = null;

      // Run both endpoints in parallel
      try {
        const [dlRes, trRes] = await Promise.allSettled([
          fetch('/api/v1/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          }),
          fetch('/api/v1/transcript', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          }),
        ]);

        // --- parse resolve ---
        if (dlRes.status === 'fulfilled') {
          try { downloadData = await dlRes.value.json(); }
          catch (e) { downloadData = null; }
        }

        // --- parse transcript ---
        if (trRes.status === 'fulfilled') {
          try { transcriptData = await trRes.value.json(); }
          catch (e) { transcriptData = null; }
        }

        // --- render ---
        if (downloadData && downloadData.status === 'ok') {
          const caption = (transcriptData && transcriptData.status === 'ok' && transcriptData.transcript)
            ? transcriptData.transcript
            : '';

          const captionHtml = caption
            ? `<div class="caption-box">${escapeHtml(caption)}</div>`
            : `<div class="caption-box caption-empty">No caption available for this video.</div>`;

          const transcriptStatus = (transcriptData && transcriptData.status === 'ok')
            ? `${caption.length} chars`
            : (transcriptData && transcriptData.error) || 'no transcript';

          result.className = '';
          result.innerHTML = `
            <div>✅ Direct link captured:</div>
            <a class="download" href="${escapeHtml(downloadData.download_url)}" target="_blank" rel="noopener">
              Download video
            </a>

            <div class="caption-label">
              📝 Caption
              ${caption ? `<button class="copy-btn" onclick="copyBlock(this)">Copy</button>` : ''}
            </div>
            ${captionHtml}

            <div class="url-label">
              Direct URL:
              <button class="copy-btn" onclick="copyBlock(this)">Copy</button>
            </div>
            <pre class="url-box">${escapeHtml(downloadData.download_url)}</pre>

            <div class="meta">
              file: ${escapeHtml(downloadData.filename || '—')}
              · transcript: ${escapeHtml(transcriptStatus)}
            </div>
          `;
        } else {
          const err = (downloadData && downloadData.detail)
                   || 'Failed to resolve';
          result.className = 'error';
          result.textContent = '❌ ' + err;
        }
      } catch (err) {
        result.className = 'error';
        result.textContent = '❌ Network error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    // Copies whichever block this button sits in.
    // For .caption-label / .url-label the button is inside the label,
    // and the target text is the next sibling element.
    function copyBlock(btn) {
      const target = btn.parentElement.nextElementSibling;
      if (!target) return;
      const text = target.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      }).catch(() => {
        btn.textContent = 'Failed';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }
  </script>
</body>
</html>
